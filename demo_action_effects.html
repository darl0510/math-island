<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>奇幻數學島 — 10大角色專屬技能庫 ✕ 純淨零邊界透明感 ✕ 夢幻群蝶身後飛出系統</title>
  <style>
    :root {
      --bg-dark: #0b1120;
      --card-bg: rgba(30, 41, 59, 0.94);
      --primary: #38bdf8;
      --gold: #fbbf24;
      --pink: #f472b6;
      --purple: #c084fc;
      --red: #ef4444;
      --green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 16px 50px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 1.85rem;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #38bdf8, #fbbf24, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
    }

    p.subtitle {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 16px;
      text-align: center;
    }

    .main-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 980px;
      gap: 16px;
    }

    /* 角色分類膠囊標籤 */
    .role-section-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
    }

    .group-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 800;
      color: #64748b;
    }

    .role-nav-wrap {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.45);
      padding: 6px 12px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .role-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }

    .role-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .role-btn.active {
      color: #fff;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
    }

    .role-btn.active.boy {
      background: linear-gradient(135deg, #0284c7, #3b82f6);
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
    }

    /* 舞台展示卡片 */
    .stage-card {
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      width: 100%;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      backdrop-filter: blur(12px);
    }

    /* 舞台主視覺框 */
    .stage-view {
      width: 100%;
      height: 380px;
      background: radial-gradient(circle at center, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
      border-radius: 20px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* 角色立繪基底 (100% 純淨透明無底色) */
    .char-sprite {
      height: 290px;
      z-index: 5;
      position: relative;
      filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.6));
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 敵人立繪基底 */
    .enemy-sprite {
      height: 260px;
      z-index: 4;
      position: absolute;
      display: none;
      filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.8));
      pointer-events: none;
    }

    /* ══════════════════════════════════════════════════
       極致零殘留透明光感 (強制徑向羽化遮罩，徹底杜絕任何方形邊框)
       ══════════════════════════════════════════════════ */
    .vfx-layer {
      position: absolute;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.2);
      transition: none;
      mix-blend-mode: screen;
      /* 核心防框線防線：強制柔和邊緣漸變羽化遮罩，杜絕任何圖片物理裁切線 */
      -webkit-mask-image: radial-gradient(circle at center, black 45%, transparent 88%);
      mask-image: radial-gradient(circle at center, black 45%, transparent 88%);
    }

    /* ══════════════════════════════════════════════════
       夢幻群蝶自身後飛出系統 (Dreamy Fluttering Butterfly Swarm)
       ══════════════════════════════════════════════════ */
    .butterfly-swarm-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 4; /* 起飛於公主身後 (z-index: 4, 公主 z-index: 5) */
      overflow: hidden;
    }

    .dreamy-butterfly {
      position: absolute;
      width: 44px;
      height: 44px;
      left: 0;
      top: 0;
      opacity: 0;
      pointer-events: none;
      animation: flutterFly 1.7s cubic-bezier(0.25, 0.9, 0.35, 1) forwards;
    }

    @keyframes flutterFly {
      0% {
        opacity: 0;
        transform: translate(var(--startX), var(--startY)) scale(0.15) rotate(0deg);
        z-index: 4;
      }
      20% {
        opacity: 1;
        transform: translate(calc(var(--startX) + (var(--targetX) - var(--startX)) * 0.35), calc(var(--startY) + (var(--targetY) - var(--startY)) * 0.35 - 30px)) scale(var(--scale)) rotate(15deg);
        z-index: 6; /* 飛升掠過公主身前 */
      }
      70% {
        opacity: 0.95;
        transform: translate(calc(var(--startX) + (var(--targetX) - var(--startX)) * 0.75), calc(var(--startY) + (var(--targetY) - var(--startY)) * 0.75 - 50px)) scale(calc(var(--scale) * 1.15)) rotate(-15deg);
        z-index: 6;
      }
      100% {
        opacity: 0;
        transform: translate(var(--targetX), var(--targetY)) scale(calc(var(--scale) * 1.4)) rotate(25deg);
        z-index: 6;
      }
    }

    .butterfly-body {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 10px var(--color)) drop-shadow(0 0 18px rgba(255, 255, 255, 0.7));
    }

    .butterfly-wing {
      width: 100%;
      height: 100%;
      object-fit: contain;
      animation: wingFlap 0.16s ease-in-out infinite alternate;
      transform-origin: center center;
    }

    @keyframes wingFlap {
      0% { transform: scaleX(1); }
      100% { transform: scaleX(0.22); }
    }

    .butterfly-core-glow {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 12px var(--color), 0 0 20px #ffffff;
    }

    /* ══════════════════════════════════════════════════
       無框有機自然流光 (聖盾光罩、貫穿雷射、地裂震撼、天幕極光)
       ══════════════════════════════════════════════════ */

    /* 1. 全身聖光守護防護光罩 (柔和羽化光球) */
    .dome-shield-wrap {
      position: absolute;
      width: 330px;
      height: 330px;
      border-radius: 50%;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: none;
      -webkit-mask-image: radial-gradient(circle at center, black 65%, transparent 100%);
      mask-image: radial-gradient(circle at center, black 65%, transparent 100%);
    }

    .dome-shield-sphere {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at center, rgba(251, 191, 36, 0.08) 0%, rgba(251, 191, 36, 0.28) 60%, rgba(255, 255, 255, 0.75) 90%, rgba(251, 191, 36, 0.95) 100%);
      box-shadow: 0 0 35px rgba(251, 191, 36, 0.65), inset 0 0 30px rgba(255, 255, 255, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.85);
    }

    .dome-shield-ring {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 2px dashed rgba(251, 191, 36, 0.6);
      animation: spinRing 4s linear infinite;
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .anim-dome-active {
      animation: aDomeShield 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes aDomeShield {
      0% { opacity: 0; transform: scale(0.3); }
      20% { opacity: 1; transform: scale(1.08); }
      40% { opacity: 0.9; transform: scale(1.0); }
      75% { opacity: 1; transform: scale(1.04); }
      100% { opacity: 0; transform: scale(1.22); }
    }

    /* 2. 貫穿全屏的高速雷霆光束 */
    .thrust-beam-layer {
      position: absolute;
      left: 45%;
      top: 50%;
      transform: translateY(-50%) scaleX(0);
      transform-origin: left center;
      width: 520px;
      height: 18px;
      background: linear-gradient(90deg, #fff 0%, #38bdf8 30%, #fbbf24 70%, transparent 100%);
      box-shadow: 0 0 25px #38bdf8, 0 0 45px #fbbf24;
      border-radius: 9999px;
      z-index: 7;
      opacity: 0;
      pointer-events: none;
    }
    .anim-beam-active {
      animation: aThrustBeam 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes aThrustBeam {
      0% { opacity: 0; transform: translateY(-50%) scaleX(0); }
      25% { opacity: 1; transform: translateY(-50%) scaleX(1.1); }
      60% { opacity: 0.9; transform: translateY(-50%) scaleX(1); }
      100% { opacity: 0; transform: translateY(-50%) scaleX(1.2); }
    }

    /* 3. 地面震撼碎裂光環 */
    .ground-crack-layer {
      position: absolute;
      bottom: 25px;
      width: 360px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(251, 191, 36, 0.6) 0%, rgba(239, 68, 68, 0.4) 40%, transparent 75%);
      box-shadow: 0 0 35px rgba(251, 191, 36, 0.75);
      border-bottom: 3px solid rgba(251, 191, 36, 0.9);
      opacity: 0;
      transform: scale(0.3);
      z-index: 3;
      pointer-events: none;
    }
    .anim-crack-active {
      animation: aGroundCrack 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes aGroundCrack {
      0% { opacity: 0; transform: scale(0.2); }
      30% { opacity: 1; transform: scale(1.15); }
      70% { opacity: 0.8; transform: scale(1.0); }
      100% { opacity: 0; transform: scale(1.3); }
    }

    /* 4. 極光天幕全屏流動星河 (純透明流光，零裁切邊界) */
    .aurora-sky-layer {
      position: absolute;
      inset: -20px;
      background: radial-gradient(circle at 50% 30%, rgba(192, 132, 252, 0.35) 0%, rgba(56, 189, 248, 0.3) 35%, rgba(244, 114, 182, 0.25) 60%, transparent 85%);
      filter: blur(20px);
      opacity: 0;
      z-index: 1;
      pointer-events: none;
    }
    .aurora-rainbow-ribbon {
      position: absolute;
      top: 15%;
      left: -10%;
      width: 120%;
      height: 120px;
      background: linear-gradient(90deg, transparent 0%, rgba(239, 68, 68, 0.4) 15%, rgba(251, 191, 36, 0.5) 30%, rgba(16, 185, 129, 0.5) 50%, rgba(56, 189, 248, 0.5) 70%, rgba(192, 132, 252, 0.4) 85%, transparent 100%);
      filter: blur(14px);
      transform: rotate(-12deg);
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    .anim-aurora-sky {
      animation: aAuroraSky 1.7s ease-in-out forwards;
    }
    @keyframes aAuroraSky {
      0% { opacity: 0; transform: scale(0.85); }
      35% { opacity: 0.95; transform: scale(1.05); }
      70% { opacity: 0.8; transform: scale(1.0); }
      100% { opacity: 0; transform: scale(1.15); }
    }

    /* ── 動畫關鍵幀清單 ── */
    .anim-spin-circle { animation: aSpinCircle 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes aSpinCircle {
      0% { opacity: 0; transform: scale(0.2) rotate(0deg); }
      30% { opacity: 1; transform: scale(1.15) rotate(110deg); }
      70% { opacity: 0.9; transform: scale(1.05) rotate(220deg); }
      100% { opacity: 0; transform: scale(1.35) rotate(360deg); }
    }

    .anim-frost { animation: aFrostBlast 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes aFrostBlast {
      0% { opacity: 0; transform: scale(0.2) rotate(0deg); }
      30% { opacity: 1; transform: scale(1.2) rotate(90deg); }
      70% { opacity: 0.85; transform: scale(1.05) rotate(160deg); }
      100% { opacity: 0; transform: scale(1.3) rotate(220deg); }
    }

    .anim-heart { animation: aHeartPulse 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes aHeartPulse {
      0% { opacity: 0; transform: scale(0.4); }
      25% { opacity: 1; transform: scale(1.18); }
      45% { opacity: 0.8; transform: scale(1.02); }
      65% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0; transform: scale(1.4); }
    }

    .anim-crescent { animation: aCrescentSlash 0.75s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards; }
    @keyframes aCrescentSlash {
      0% { opacity: 0; transform: scale(0.3) rotate(-65deg) translateX(-60px); }
      35% { opacity: 1; transform: scale(1.25) rotate(15deg) translateX(10px); }
      70% { opacity: 0.8; transform: scale(1.1) rotate(45deg) translateX(30px); }
      100% { opacity: 0; transform: scale(1.4) rotate(70deg) translateX(70px); }
    }

    .anim-cross { animation: aCrossSlash 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes aCrossSlash {
      0% { opacity: 0; transform: scale(0.2) rotate(45deg); }
      30% { opacity: 1; transform: scale(1.25) rotate(0deg); }
      70% { opacity: 0.9; transform: scale(1.1) rotate(0deg); }
      100% { opacity: 0; transform: scale(1.4) rotate(-15deg); }
    }

    .anim-whirlwind { animation: aWhirlwind 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes aWhirlwind {
      0% { opacity: 0; transform: scale(0.4) rotate(0deg); }
      40% { opacity: 1; transform: scale(1.15) rotate(180deg); }
      70% { opacity: 0.85; transform: scale(1.1) rotate(360deg); }
      100% { opacity: 0; transform: scale(1.35) rotate(540deg); }
    }

    .anim-shockwave { animation: aShockwave 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes aShockwave {
      0% { opacity: 0; transform: scale(0.3) translateY(30px); }
      30% { opacity: 1; transform: scale(1.2) translateY(0); }
      70% { opacity: 0.85; transform: scale(1.1) translateY(-10px); }
      100% { opacity: 0; transform: scale(1.35) translateY(-25px); }
    }

    .anim-thrust { animation: aThunderThrust 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes aThunderThrust {
      0% { opacity: 0; transform: scale(0.3) translateX(-120px); }
      30% { opacity: 1; transform: scale(1.25) translateX(30px); }
      65% { opacity: 0.85; transform: scale(1.1) translateX(10px); }
      100% { opacity: 0; transform: scale(1.4) translateX(90px); }
    }

    .anim-sword-slash { animation: aSwordSlash 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes aSwordSlash {
      0% { opacity: 0; transform: scale(0.4) rotate(-40deg) translateX(-40px); }
      35% { opacity: 1; transform: scale(1.2) rotate(10deg) translateX(15px); }
      100% { opacity: 0; transform: scale(1.35) rotate(35deg) translateX(50px); }
    }

    /* ── 答錯敵方反擊專屬動畫 ── */
    .anim-slime-splat { animation: aSlimeSplat 1.3s cubic-bezier(0.2, 0.9, 0.3, 1) forwards; }
    @keyframes aSlimeSplat {
      0% { opacity: 0; transform: scale(0.1) rotate(-15deg); }
      25% { opacity: 1; transform: scale(1.25) rotate(5deg); }
      60% { opacity: 0.9; transform: scale(1.05) rotate(0deg); }
      100% { opacity: 0; transform: scale(1.3) translateY(30px); }
    }

    .anim-shadow-burst { animation: aShadowBurst 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes aShadowBurst {
      0% { opacity: 0; transform: scale(0.2); }
      30% { opacity: 1; transform: scale(1.3); }
      70% { opacity: 0.85; transform: scale(1.15); }
      100% { opacity: 0; transform: scale(1.45); }
    }

    .anim-claw-strike { animation: aClawStrike 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    @keyframes aClawStrike {
      0% { opacity: 0; transform: scale(0.4) rotate(-30deg) translate(-50px, -30px); }
      30% { opacity: 1; transform: scale(1.2) rotate(0deg) translate(0, 0); }
      65% { opacity: 0.9; transform: scale(1.05) translate(10px, 10px); }
      100% { opacity: 0; transform: scale(1.35) translate(40px, 30px); }
    }

    /* 角色與敵人動作姿態 */
    .char-cast { transform: scale(1.08) translateY(-14px); filter: drop-shadow(0 0 25px rgba(236, 72, 153, 0.8)); }
    .char-slash { transform: scale(1.12) translateX(18px) rotate(4deg); filter: drop-shadow(0 0 25px rgba(56, 189, 248, 0.8)); }
    .char-shielded { transform: scale(1.03); filter: drop-shadow(0 0 25px rgba(251, 191, 36, 0.85)); }
    .char-hurt { transform: scale(0.92) translateX(-18px) rotate(-6deg); filter: brightness(0.6) sepia(1) hue-rotate(300deg); }
    .enemy-attack { transform: scale(1.18) translateX(-20px); filter: drop-shadow(0 0 35px rgba(239, 68, 68, 0.9)); }

    /* 震動回饋 */
    .shake-light { animation: aShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
    .shake-heavy { animation: aShakeHeavy 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
    @keyframes aShake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }
    @keyframes aShakeHeavy {
      10%, 90% { transform: translate3d(-5px, 3px, 0); }
      20%, 80% { transform: translate3d(8px, -4px, 0); }
      30%, 50%, 70% { transform: translate3d(-10px, 6px, 0); }
      40%, 60% { transform: translate3d(10px, -5px, 0); }
    }

    /* 提示橫幅 */
    .toast-banner {
      position: absolute;
      top: 14px;
      padding: 8px 18px;
      border-radius: 9999px;
      font-size: 0.86rem;
      font-weight: 700;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s;
      z-index: 10;
      pointer-events: none;
      max-width: 90%;
      text-align: center;
    }
    .toast-banner.show { opacity: 1; transform: translateY(0); }
    .toast-wrong { background: rgba(239, 68, 68, 0.92); color: #ffffff; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5); }
    .toast-warning { background: rgba(245, 158, 11, 0.92); color: #ffffff; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.5); }
    .toast-win { background: rgba(16, 185, 129, 0.92); color: #ffffff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.5); }

    /* 控制面板大按鈕 */
    .btn-super {
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      font-size: 0.96rem;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-super:hover { transform: translateY(-2px); filter: brightness(1.1); }

    .control-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      width: 100%;
      margin-top: 14px;
    }

    .btn-magic-action { background: linear-gradient(135deg, #ec4899, #fbbf24); color: #fff; box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3); }
    
    .counter-attack-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 10px;
      width: 100%;
      margin-top: 10px;
    }

    .btn-counter-slime { background: linear-gradient(135deg, #059669, #10b981); color: #fff; }
    .btn-counter-titan { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; }
    .btn-counter-boss { background: linear-gradient(135deg, #7c3aed, #ef4444); color: #fff; }

    /* 角色技能矩陣 */
    .skill-dashboard { width: 100%; margin-top: 20px; }
    .section-title {
      font-size: 0.92rem;
      color: #94a3b8;
      margin-bottom: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .skill-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));

    // ── Web Audio 純代碼原生音效合成系統 ──
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, type, dur, vol = 0.35, timeOffset = 0) {
      const now = audioCtx.currentTime + timeOffset;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, time);
      g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(g); g.connect(audioCtx.destination);
      osc.start(now); osc.stop(now + dur + 0.05);
    }

    function playNoise(dur, fStart, fEnd, vol = 0.35) {
      const now = audioCtx.currentTime;
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
      const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const n = audioCtx.createBufferSource(); n.buffer = buf;
      const f = audioCtx.createBiquadFilter(); f.type = 'bandpass';
      f.frequency.setValueAtTime(fStart, now); f.frequency.exponentialRampToValueAtTime(fEnd, now + dur);
      const g = audioCtx.createGain(); g.gain.setValueAtTime(vol, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + dur);
      n.connect(f); f.connect(g); g.connect(audioCtx.destination);
      n.start(now);
    }

    function playSkillSound(soundType) {
      initAudio();
      const now = audioCtx.currentTime;
      if (soundType === 'magic_chime') {
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => playTone(f, 'sine', 0.5, 0.25, i * 0.08));
      } else if (soundType === 'butterfly') {
        // 夢幻輕靈的水晶風鈴旋律
        [659.25, 783.99, 880, 1046.5, 1174.66, 1318.5].forEach((f, i) => playTone(f, 'triangle', 0.45, 0.18, i * 0.07));
      } else if (soundType === 'ice') {
        [1200, 1500, 1800, 2200].forEach((f, i) => playTone(f, 'sine', 0.35, 0.18, i * 0.05));
      } else if (soundType === 'shield') {
        playTone(329.63, 'sine', 0.8, 0.4); playTone(659.25, 'sine', 0.7, 0.3, 0.1);
      } else if (soundType === 'supernova') {
        playNoise(0.9, 1500, 150, 0.4);
        [440, 554, 659, 880, 1108].forEach((f, i) => playTone(f, 'triangle', 0.8, 0.22, i * 0.06));
      } else if (soundType === 'slash') {
        playNoise(0.28, 2800, 350, 0.5);
      } else if (soundType === 'heavy_cross') {
        playNoise(0.35, 2400, 200, 0.5);
        playTone(180, 'sawtooth', 0.25, 0.3, 0.05);
      } else if (soundType === 'whirlwind') {
        playNoise(0.65, 900, 400, 0.4);
      } else if (soundType === 'impact') {
        playNoise(0.55, 600, 60, 0.6);
        playTone(80, 'sawtooth', 0.4, 0.5);
      } else if (soundType === 'thunder') {
        playNoise(0.4, 3200, 150, 0.55);
        playTone(140, 'square', 0.3, 0.35);
      }
    }

    // ── 🦋 動態夢幻群蝶自公主背後飛出系統 (100% 透明無方框・振翅起舞) ──
    function spawnDreamyButterflies(count = 20, themeColors = ['#f472b6', '#fbbf24', '#38bdf8', '#c084fc']) {
      const container = document.getElementById('butterflySwarm');
      container.innerHTML = '';

      const stage = document.getElementById('stageView');
      const w = stage.offsetWidth;
      const h = stage.offsetHeight;

      // 起飛起點：公主身後裙擺與法杖中央
      const startX = w / 2 - 22;
      const startY = h / 2 - 10;

      for (let i = 0; i < count; i++) {
        const b = document.createElement('div');
        b.className = 'dreamy-butterfly';

        // 擴散飛行動畫軌跡 (向外綻放旋舞)
        const angle = (Math.PI * 2 * (i / count)) + (Math.random() - 0.5) * 0.7;
        const dist = 140 + Math.random() * 220;
        const targetX = startX + Math.cos(angle) * dist;
        const targetY = startY + Math.sin(angle) * (dist * 0.75) - 65; // 偏向上空飛翔

        const delay = Math.random() * 0.45;
        const duration = 1.3 + Math.random() * 0.5;
        const scale = 0.5 + Math.random() * 0.5;
        const color = themeColors[Math.floor(Math.random() * themeColors.length)];

        b.style.setProperty('--startX', `${startX}px`);
        b.style.setProperty('--startY', `${startY}px`);
        b.style.setProperty('--targetX', `${targetX}px`);
        b.style.setProperty('--targetY', `${targetY}px`);
        b.style.setProperty('--scale', scale);
        b.style.setProperty('--color', color);
        b.style.animationDelay = `${delay}s`;
        b.style.animationDuration = `${duration}s`;

        b.innerHTML = `
          <div class="butterfly-body">
            <img src="assets/vfx/vfx_single_fairy_butterfly.webp" class="butterfly-wing" alt="蝶翼">
            <div class="butterfly-core-glow"></div>
          </div>
        `;
        container.appendChild(b);
      }
    }

    // ── 粒子物理發射引擎 ──
    function spawnParticles(colors, count = 35) {
      const canvas = document.getElementById('canvasParticle');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight;
      const particles = [];
      for (let i = 0; i < count; i++) {
        particles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 60,
          y: canvas.height / 2 + (Math.random() - 0.5) * 60,
          vx: (Math.random() - 0.5) * 11, vy: (Math.random() - 0.7) * 12,
          size: Math.random() * 5 + 3,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1, rot: Math.random() * 360, vrot: (Math.random() - 0.5) * 14
        });
      }
      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        particles.forEach(p => {
          if (p.alpha > 0.02) {
            alive = true; p.x += p.vx; p.y += p.vy; p.vy += 0.28;
            p.alpha *= 0.95; p.rot += p.vrot;
            ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
            ctx.translate(p.x, p.y); ctx.rotate((p.rot * Math.PI) / 180);
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
            ctx.restore();
          }
        });
        if (alive) requestAnimationFrame(render);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      render();
    }

    // 預設初始化
    switchRole('princess_magic');
  </script>
</body>
</html>
